services:
  app:
    build: .
    restart: always
    ports:
      - "4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - backend_network

  nginx:
    image: nginx:alpine
    container_name: backend_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - backend_network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: demo_tunnel
    restart: always
    command: tunnel --url http://nginx:80
    depends_on:
      - nginx
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge
